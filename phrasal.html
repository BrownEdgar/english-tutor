<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>300+ фраз и разговорных блоков</title>
</head>
<body>

  <div class="phrasal-header">
    <h1>300+ блоков<br>для <em>разговора</em></h1>
    <p class="subtitle">Фразовые глаголы + дискурс (B2–C1)</p>
  </div>

  <div class="phrasal-tip">
    <strong>Что такое фразовый глагол?</strong> Это глагол + предлог = <strong>новый смысл</strong><br>
    put = класть · put <strong>on</strong> = надевать · put <strong>off</strong> = откладывать · put <strong>down</strong> = опускать<br>
    Кликай карточку — отмечай выученное
  </div>

  <div class="phrasal-controls">
    <button class="filter-btn active" data-cat="all">Все</button>
    <button class="filter-btn" data-cat="motion">Движение</button>
    <button class="filter-btn" data-cat="object">Предметы</button>
    <button class="filter-btn" data-cat="relation">Люди</button>
    <button class="filter-btn" data-cat="emotion">Эмоции</button>
    <button class="filter-btn" data-cat="daily">Быт</button>
    <button class="filter-btn" data-cat="talk">Речь</button>
    <input class="search-input" id="search" placeholder="Поиск..." style="width:180px;flex-shrink:0">
  </div>

  <div class="phrasal-stats">
    <span>Выучено: <strong id="lc">0</strong> / <strong id="tc">0</strong></span>
    <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  </div>

  <div class="grid" id="grid"></div>

  <script type="module" src="/src/phrasal/main.js"></script>
</body>
</html>
